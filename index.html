<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GN Bar">
<title>GN Bar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">GN&nbsp;Bar <span id="barman"></span></div>
  <nav>
    <button data-tab="prodej" class="on">Prodej</button>
    <button data-tab="prehled">Přehled</button>
    <button data-tab="nastaveni">⚙︎</button>
  </nav>
</header>

<main>
  <!-- PRODEJ -->
  <section id="prodej" class="tab on">
    <div id="menu"></div>
  </section>

  <!-- PŘEHLED -->
  <section id="prehled" class="tab">
    <div class="cards">
      <div class="card"><small>Celkem</small><b id="sCelkem">0 Kč</b><span id="sPocet"></span></div>
      <div class="card cash"><small>Hotově</small><b id="sHotove">0 Kč</b><span id="sHotoveN"></span></div>
      <div class="card card-k"><small>Kartou</small><b id="sKarta">0 Kč</b><span id="sKartaN"></span></div>
    </div>
    <h3>Prodané položky</h3>
    <table id="tPolozky"></table>
    <h3>Poslední účty</h3>
    <div id="ucty"></div>
    <div class="row">
      <button class="btn" id="btnExport">Export CSV</button>
      <button class="btn danger" id="btnUzaverka">Uzávěrka (smazat)</button>
    </div>
  </section>

  <!-- NASTAVENÍ -->
  <section id="nastaveni" class="tab">
    <label>Jméno barmana / bar<input id="inBarman" placeholder="např. Kuba – bar 1"></label>

    <h3>Otevření PayPhone</h3>
    <label>Telefon
      <select id="inRezim">
        <option value="android">Android (otevře appku PayPhone)</option>
        <option value="ios">iPhone (přes Zkratku „PayPhone“)</option>
        <option value="vlastni">Vlastní odkaz</option>
        <option value="nic">Neotvírat, jen ukázat částku</option>
      </select>
    </label>
    <label id="lbVlastni">Vlastní odkaz ({castka} = částka v Kč, {haleru} = v haléřích)<input id="inVlastni" placeholder="např. payphone://pay?amount={castka}"></label>
    <p class="hint" id="hintRezim"></p>
    <button class="btn" id="btnTest">Vyzkoušet otevření PayPhone</button>

    <h3>Ceník</h3>
    <p class="hint">Jedna položka na řádek: <code>Kategorie; Název; Cena</code></p>
    <textarea id="inCenik" rows="16" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn primary" id="btnUlozit">Uložit nastavení</button>
      <button class="btn" id="btnVychozi">Výchozí ceník</button>
    </div>
    <p class="hint">Data zůstávají jen v tomhle telefonu. Appka funguje i bez signálu.</p>
  </section>
</main>

<!-- spodní lišta s účtem -->
<footer id="ucet">
  <div id="polozkyUctu"></div>
  <div class="sum">
    <button id="btnZrusit" class="ghost">✕</button>
    <div class="total"><small>Celkem</small><b id="total">0 Kč</b></div>
  </div>
  <div class="pay">
    <button id="btnHotove" class="cash">Hotově</button>
    <button id="btnKartou" class="card-k">Kartou</button>
  </div>
</footer>

<!-- dialog hotovost -->
<div class="overlay" id="dlgHotove">
  <div class="sheet">
    <small>Zaplatit hotově</small>
    <div class="big" id="hCastka"></div>
    <small>Zákazník dal</small>
    <div class="grid4" id="hDal"></div>
    <div class="vratit" id="hVratit"></div>
    <div class="row">
      <button class="btn" data-close>Zpět</button>
      <button class="btn cash" id="hOk">Zaplaceno</button>
    </div>
  </div>
</div>

<!-- dialog karta -->
<div class="overlay" id="dlgKarta">
  <div class="sheet">
    <small>Zadej v PayPhone</small>
    <div class="big karta" id="kCastka"></div>
    <div class="hint" id="kSchranka"></div>
    <button class="btn card-k xl" id="kOtevrit">Otevřít PayPhone</button>
    <small id="kOtazka">Prošla platba?</small>
    <div class="row">
      <button class="btn danger" id="kNe">Neprošla</button>
      <button class="btn cash" id="kAno">Prošla ✓</button>
    </div>
    <button class="btn ghost" data-close>Zpět k účtu</button>
  </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
